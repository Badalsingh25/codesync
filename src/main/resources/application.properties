spring.application.name=demo
server.port=8080


spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://${DB_HOST:localhost}:3306/cbc}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
execution.container-path=${EXECUTION_CONTAINER_PATH:}
execution.host-path=${EXECUTION_HOST_PATH:}


spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
# No default: the app must fail to start rather than sign tokens with a
# well-known placeholder secret. Set JWT_SECRET in your environment/.env
# (generate with: openssl rand -base64 64).
jwt.secret=${JWT_SECRET}
jwt.expiration=86400000

# Swagger/OpenAPI UI is now behind authentication by default (see
# SecurityConfigJWT). To browse it unauthenticated on your own machine while
# developing, run with: --app.swagger.public=true (or set it in a local
# application-dev.properties / an IDE run config) — never enable this in a
# production environment.
app.swagger.public=${APP_SWAGGER_PUBLIC:false}
jwt.refresh-expiration=604800000

cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost,http://localhost:80,http://localhost:8080,http://localhost:5173,http://localhost:5174,http://localhost:5175,http://localhost:5176}




