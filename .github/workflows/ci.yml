# Basic build-verification CI. There was no CI/CD at all previously — this
# does not deploy anything, it just fails a pull request loudly if the
# backend or frontend no longer builds, which is the highest-value, lowest-
# effort thing to add first. Wire up an actual deploy job (SSH + `docker
# compose pull/up`, or a registry push) once you're comfortable with this
# passing reliably.
name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  backend:
    name: Backend (Maven)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'

      - name: Build and test
        # A dummy JWT_SECRET is fine here — the test suite only needs the
        # Spring context to start with *some* value, tests don't rely on the
        # real production secret.
        env:
          JWT_SECRET: ci-only-placeholder-not-a-real-secret
        run: mvn -B clean verify

  frontend:
    name: Frontend (Vite)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint --if-present

      - name: Build
        env:
          VITE_API_BASE_URL: https://api.example.com
        run: npm run build
